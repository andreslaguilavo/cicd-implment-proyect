version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: cicd_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integracion_continua_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: integracion-continua-app
    container_name: cicd_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: cicd_db
      DB_PORT: 3306
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    ports:
      - "5000:5000"
    networks:
      - integracion_continua_net

networks:
  # Red compartida entre la app, la DB y el contenedor de Jenkins
  integracion_continua_net:
    driver: bridge

volumes:
  dbdata:
